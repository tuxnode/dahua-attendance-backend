[app]
name = "dahua-attendance-backend"
env = "dev"

[http]
addr = ":8080"
max_body_bytes = 10485760
read_header_timeout = "5s"
read_timeout = "15s"
write_timeout = "5s"
idle_timeout = "60s"
shutdown_timeout = "10s"

[database]
driver = "mysql"
dsn = "user:password@tcp(127.0.0.1:3306)/dahua_attendance?parseTime=true&charset=utf8mb4&loc=Local"
max_open_conns = 10
max_idle_conns = 5
conn_max_lifetime = "30m"
connect_timeout = "5s"

[dubbo]
enabled = false
interface = "attendance.v1.AttendanceService"
group = "DEFAULT_GROUP"
version = "1.0.0"
protocol = "triple"
port = 20000
advertise_ip = ""

[nacos]
enabled = false
address = "127.0.0.1:8848"
namespace = "public"
group = "DEFAULT_GROUP"
username = ""
password = ""

[log]
level = "info"
file_path = ""
